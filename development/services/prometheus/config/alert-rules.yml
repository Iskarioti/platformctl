groups:
  - name: platformctl-starter-rules
    rules:
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus scrape target down: {{ $labels.job }}"

      - alert: ContainerOOMKilled
        expr: increase(container_oom_events_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Container was OOM-killed: {{ $labels.name }}"
