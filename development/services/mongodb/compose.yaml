services:
  mongodb:
    image: ${MONGODB_IMAGE}:${MONGODB_VERSION}
    container_name: dev-mongodb
    hostname: dev-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host localhost
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks: [platform-dev]
    mem_limit: 1g

networks:
  platform-dev:
    external: true
    name: platform-dev

volumes:
  mongodb-data:
    name: platform-mongodb-data
