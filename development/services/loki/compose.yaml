services:
  loki:
    image: ${LOKI_IMAGE}:${LOKI_VERSION}
    container_name: dev-loki
    hostname: dev-loki
    command:
      - -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./development/services/loki/config/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_HOST_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform-dev]
    mem_limit: 512m

networks:
  platform-dev:
    external: true
    name: platform-dev

volumes:
  loki-data:
    name: platform-loki-data
