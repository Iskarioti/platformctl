services:
  # One-shot, idempotent bootstrap against the SHARED postgres/clickhouse
  # dev-services (this repo's convention: "project-specific databases belong
  # to project bootstrap" - postgres/config/init/00-platform.sql says so
  # explicitly). Langfuse gets its own logical database inside each shared
  # instance rather than writing into the shared default one.
  #
  # Configuration independence (AGENTS.md): every ${LANGFUSE_*} variable
  # below is langfuse's OWN name, resolved from the actual dependency via
  # service.json's "consumes" map - this file never references
  # ${POSTGRES_*}/${CLICKHOUSE_*}/${REDIS_*}/${GARAGE_*} directly, so it
  # can't silently break if a dependency renames or replaces one of those.
  langfuse-postgres-init:
    image: ${LANGFUSE_DB_INIT_IMAGE}:${LANGFUSE_DB_INIT_VERSION}
    container_name: dev-langfuse-postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${LANGFUSE_DB_PASSWORD}
      LANGFUSE_DB_USER: ${LANGFUSE_DB_USER}
    entrypoint:
      - bash
      - -ec
      - |
        exists="$$(psql -h dev-postgres -U "$$LANGFUSE_DB_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='langfuse'")"
        if [ "$$exists" != "1" ]; then
          psql -h dev-postgres -U "$$LANGFUSE_DB_USER" -d postgres -c "CREATE DATABASE langfuse"
        fi
    networks: [platform-dev]

  langfuse-clickhouse-init:
    image: ${LANGFUSE_ANALYTICS_INIT_IMAGE}:${LANGFUSE_ANALYTICS_INIT_VERSION}
    container_name: dev-langfuse-clickhouse-init
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      LANGFUSE_ANALYTICS_USER: ${LANGFUSE_ANALYTICS_USER}
      LANGFUSE_ANALYTICS_PASSWORD: ${LANGFUSE_ANALYTICS_PASSWORD}
    entrypoint:
      - bash
      - -ec
      - |
        clickhouse-client --host dev-clickhouse --user "$$LANGFUSE_ANALYTICS_USER" --password "$$LANGFUSE_ANALYTICS_PASSWORD" --query "CREATE DATABASE IF NOT EXISTS langfuse"
    networks: [platform-dev]

  langfuse-worker:
    image: ${LANGFUSE_WORKER_IMAGE}:${LANGFUSE_WORKER_VERSION}
    container_name: dev-langfuse-worker
    hostname: langfuse-worker
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      garage:
        condition: service_started
      langfuse-postgres-init:
        condition: service_completed_successfully
      langfuse-clickhouse-init:
        condition: service_completed_successfully
    environment: &langfuse-env
      # Docker auto-injects HOSTNAME=<the "hostname:" below> into the
      # container's env, and Langfuse's Next.js server binds to whatever
      # HOSTNAME resolves to instead of all interfaces - override it so the
      # server actually binds 0.0.0.0 (matters for both the in-container
      # healthcheck below and any other same-container caller).
      HOSTNAME: "0.0.0.0"
      NODE_OPTIONS: --max-old-space-size=768
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER}:${LANGFUSE_DB_PASSWORD}@dev-postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      NEXTAUTH_URL: http://localhost:${LANGFUSE_HOST_PORT:-3001}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://dev-clickhouse:9000
      CLICKHOUSE_URL: http://dev-clickhouse:8123
      CLICKHOUSE_USER: ${LANGFUSE_ANALYTICS_USER}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_ANALYTICS_PASSWORD}
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: dev-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_CACHE_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_STORAGE_BUCKET:-shared}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: garage
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_STORAGE_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_STORAGE_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://dev-garage:3900
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: langfuse/events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_STORAGE_BUCKET:-shared}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: garage
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_STORAGE_ACCESS_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_STORAGE_SECRET_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://dev-garage:3900
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: langfuse/media/
    networks: [platform-dev]
    mem_limit: 1g

  langfuse-web:
    image: ${LANGFUSE_IMAGE}:${LANGFUSE_VERSION}
    container_name: dev-langfuse
    hostname: dev-langfuse
    depends_on: *langfuse-depends-on
    environment:
      <<: *langfuse-env
      NODE_OPTIONS: --max-old-space-size=1536
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      LANGFUSE_INIT_ORG_ID: platformctl
      LANGFUSE_INIT_ORG_NAME: platformctl
      LANGFUSE_INIT_PROJECT_ID: default
      LANGFUSE_INIT_PROJECT_NAME: default
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: admin@platformctl.local
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
    ports:
      - "127.0.0.1:${LANGFUSE_HOST_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/public/health?failIfDatabaseUnavailable=true"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [platform-dev]
    mem_limit: 2g

networks:
  platform-dev:
    external: true
    name: platform-dev
