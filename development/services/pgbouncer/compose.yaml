services:
  pgbouncer:
    image: ${PGBOUNCER_IMAGE}:${PGBOUNCER_VERSION}
    container_name: dev-pgbouncer
    hostname: dev-pgbouncer
    environment:
      DB_HOST: dev-postgres
      DB_PORT: 5432
      DB_USER: ${PGBOUNCER_DB_USER}
      DB_PASSWORD: ${PGBOUNCER_DB_PASSWORD}
      DB_NAME: ${PGBOUNCER_DB_NAME}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 300
      DEFAULT_POOL_SIZE: 30
      ADMIN_USERS: ${PGBOUNCER_DB_USER}
    ports:
      - "127.0.0.1:${PGBOUNCER_HOST_PORT:-6432}:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [platform-dev]
    mem_limit: 128m

networks:
  platform-dev:
    external: true
    name: platform-dev
