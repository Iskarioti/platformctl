metadata_dir = "/data/meta"
data_dir = "/data/store"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
# rpc_secret is provided via the GARAGE_RPC_SECRET env var, not this file.

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
# admin_token is provided via the GARAGE_ADMIN_TOKEN env var, not this file.
