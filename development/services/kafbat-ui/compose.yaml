services:
  kafbat-ui:
    image: ${KAFBAT_UI_IMAGE}:${KAFBAT_UI_VERSION}
    container_name: dev-kafbat-ui
    hostname: dev-kafbat-ui
    environment:
      DYNAMIC_CONFIG_ENABLED: "false"
      SWAGGER_UI_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: platform-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: dev-kafka:29092
    ports:
      - "127.0.0.1:${KAFBAT_UI_HOST_PORT:-8080}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks: [platform-dev]
    mem_limit: 768m

networks:
  platform-dev:
    external: true
    name: platform-dev
