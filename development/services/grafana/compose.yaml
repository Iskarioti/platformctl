services:
  grafana:
    image: ${GRAFANA_IMAGE}:${GRAFANA_VERSION}
    container_name: dev-grafana
    hostname: dev-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./development/services/grafana/config/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform-dev]
    mem_limit: 512m

networks:
  platform-dev:
    external: true
    name: platform-dev

volumes:
  grafana-data:
    name: platform-grafana-data
