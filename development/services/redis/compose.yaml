services:
  redis:
    image: ${REDIS_IMAGE}:${REDIS_VERSION}
    container_name: dev-redis
    hostname: dev-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$${REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform-dev]
    mem_limit: 384m

networks:
  platform-dev:
    external: true
    name: platform-dev

volumes:
  redis-data:
    name: platform-redis-data
