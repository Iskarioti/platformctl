services:
  redis:
    image: ${REDIS_IMAGE}:${REDIS_VERSION}
    container_name: dev-redis
    hostname: dev-redis

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_ARGS: >-
        --requirepass ${REDIS_PASSWORD}

    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"

    volumes:
      - redis-data:/data
      - ./development/services/redis/config/redis.conf:/redis-stack.conf:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - platform-dev

    mem_limit: 768m
    restart: unless-stopped

networks:
  platform-dev:
    external: true
    name: platform-dev

volumes:
  redis-data:
    name: platform-redis-data
