name: behavioral-tests

# validate.yml checks that config/schema is well-formed. This workflow checks
# that things actually behave correctly at runtime - this repo has repeatedly
# had bugs (a scheduled task that failed every run, a Compose merge bug that
# silently corrupted redis's config) that pure schema validation could never
# have caught.
#
# Scoped to ubuntu-latest: it's the only GitHub-hosted runner that can
# genuinely exercise the Linux-native code path (platform/linux/*, Docker,
# platformctl serve) without WSL2/nested virtualization, which GitHub-hosted
# Windows runners don't support. Windows-specific behavior (Scheduled Tasks,
# WSL interop) is not covered here - see docs/control-plane.md.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install platformctl with test dependencies
        run: pip install -e "./platformctl[test]"
      - name: Run pytest
        run: pytest platformctl/tests -q

  dev-services-core-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bring up core dev services (postgres, redis)
        run: bash scripts/posix/services.sh up core
      - name: Wait for both containers to report healthy
        run: |
          for i in $(seq 1 30); do
            docker compose -p platform-dev ps -a --format json > /tmp/ps.jsonl
            unhealthy=$(python3 scripts/ci/count-unhealthy-services.py /tmp/ps.jsonl)
            [ "$unhealthy" = "0" ] && break
            sleep 2
          done
      - name: Verify exactly 2 healthy containers
        run: |
          docker compose -p platform-dev ps -a --format json > /tmp/ps.jsonl
          docker compose -p platform-dev ps -a
          python3 scripts/ci/verify-core-services-healthy.py /tmp/ps.jsonl
      - name: Tear down
        if: always()
        run: bash scripts/posix/services.sh down

  observability-compose-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate observability profile Compose merge (config only, no image pulls)
        run: |
          args=(-p platform-dev --project-directory "$PWD")
          for s in otel-collector prometheus loki tempo grafana cadvisor node-exporter; do
            dir="development/services/$s"
            args+=(--env-file "$dir/versions.env" --env-file "$dir/defaults.env")
            args+=(-f "$dir/compose.yaml")
          done
          docker compose "${args[@]}" config >/dev/null
          echo "OK: observability profile Compose config merges cleanly"

  control-plane-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install platformctl
        run: pip install -e ./platformctl httpx pyotp
      - name: Start the control plane against a throwaway config dir
        run: |
          mkdir -p /tmp/pctl-ci-cp
          PLATFORMCTL_CONTROL_PLANE_DIR=/tmp/pctl-ci-cp platformctl serve --port 8765 &
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:8765/setup && break
            sleep 0.5
          done
      - name: Drive the real enrollment + login + command-runner flow
        run: python3 scripts/ci/control_plane_smoke.py --port 8765

  # A real gap the Platform Engineer role review found: nothing ever
  # verified a template's own files still actually build after they're
  # scaffolded - a template can silently rot (a bad lockfile, a broken
  # devcontainer, a stale pin) with no signal until someone hits it live.
  # Each job here does a real "workstation project init" and runs that
  # template's own documented verify command against the result.
  template-python-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          [agent-app, ai, fastapi-service, mcp-server, network-automation, python-service, rag-app, research-python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Scaffold ${{ matrix.template }}
        run: bash scripts/posix/project-init.sh ${{ matrix.template }} tpl-ci-test --area labs --root /tmp
      - name: Run the template's own verify commands
        working-directory: /tmp/tpl-ci-test
        run: |
          python -m pip install -r requirements-dev.txt
          ruff check .
          pytest -q

  template-terraform-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [terraform, infra]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.13.0"
      - name: Scaffold ${{ matrix.template }}
        run: bash scripts/posix/project-init.sh ${{ matrix.template }} tpl-ci-test --area labs --root /tmp
      - name: terraform validate
        working-directory: /tmp/tpl-ci-test
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - name: ansible syntax-check (infra only)
        if: matrix.template == 'infra'
        working-directory: /tmp/tpl-ci-test
        run: |
          python -m pip install ansible
          ansible-playbook ansible/playbook.yml --syntax-check

  template-react-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Scaffold react-app
        run: bash scripts/posix/project-init.sh react-app tpl-ci-test --area labs --root /tmp
      - name: npm install && build
        working-directory: /tmp/tpl-ci-test
        run: |
          npm install
          npm run build

  template-research-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra biber latexmk
      - name: Scaffold research-paper
        run: bash scripts/posix/project-init.sh research-paper tpl-ci-test --area labs --root /tmp
      - name: make paper
        working-directory: /tmp/tpl-ci-test
        run: make paper
