name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate repository
        shell: pwsh
        run: ./scripts/ci/validate.ps1

      - name: Dry-run setup engine
        shell: pwsh
        run: ./setup.ps1 dry-run
