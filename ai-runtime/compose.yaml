name: ai-runtime

services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:?OLLAMA_VERSION must be set - see versions.env}
    container_name: ollama-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - ai-runtime
      # Also on platform-dev so any project container already joined there
      # (the same "runArgs": ["--network=platform-dev"] pattern used to reach
      # redis/qdrant) can reach "ollama:11434" directly with no extra
      # networking work per project.
      - platform-dev

volumes:
  ollama-models:
    name: ollama-models

networks:
  ai-runtime:
    external: true
    name: ai-runtime
  platform-dev:
    external: true
    name: platform-dev
