version: "3"

tasks:
  up:
    cmds:
      - docker network inspect ai-runtime >/dev/null 2>&1 || docker network create ai-runtime
      - docker compose up -d
      - docker compose ps

  down:
    cmds:
      - docker compose down

  stop:
    cmds:
      - docker compose stop

  status:
    cmds:
      - docker compose ps
      - curl -fsS http://127.0.0.1:11434/api/tags | jq .

  gemma1b:
    cmds:
      - docker compose exec ollama ollama pull gemma3:1b

  gemma4b:
    cmds:
      - docker compose exec ollama ollama pull gemma3:4b

  gemma12b:
    cmds:
      - echo "Use the ai-lab WSL profile before pulling/running 12B on this 24GB laptop."
      - docker compose exec ollama ollama pull gemma3:12b

  list:
    cmds:
      - docker compose exec ollama ollama list

  run4b:
    cmds:
      - docker compose exec ollama ollama run gemma3:4b

  test4b:
    cmds:
      - |
        curl -fsS http://127.0.0.1:11434/api/generate \
          -H 'Content-Type: application/json' \
          -d '{"model":"gemma3:4b","prompt":"Return only the word READY","stream":false}' | jq .

  remove12b:
    cmds:
      - docker compose exec ollama ollama rm gemma3:12b
