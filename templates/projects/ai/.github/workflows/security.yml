name: security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Same install commands as platform/linux/install-security-tools.sh
      # (workstation security) - one source of truth for how these tools
      # get onto a machine, whether that machine is this repo's own CI or a
      # real workstation.
      - name: Install security toolchain
        run: |
          pipx install semgrep
          pipx install checkov
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          GITLEAKS_VERSION="$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/gitleaks/gitleaks/releases/latest | sed 's#.*/tag/v##')"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks

      - name: semgrep (SAST)
        run: semgrep --config auto --error .
      - name: gitleaks (secret scanning)
        run: gitleaks detect --source . --no-banner
      - name: trufflehog (verified-secret scanning)
        run: trufflehog filesystem . --fail
      - name: trivy (vuln/secret/misconfig/license)
        run: trivy fs --exit-code 1 .
      - name: checkov (IaC scanning)
        run: checkov -d . --compact
