services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    init: true
    volumes:
      - .:/workspace:cached
      - ${HOME}/.codex:/home/vscode/.codex
      - ${HOME}/.claude:/home/vscode/.claude
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://developer:development-only@postgres:5432/application
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - ai-runtime

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: application
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U developer -d application"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 1g

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 512m

  kafka:
    image: apache/kafka:latest
    profiles: ["eventing"]
    ports:
      - "127.0.0.1:9092:9092"
    mem_limit: 1500m

volumes:
  postgres-data:
  redis-data:

networks:
  ai-runtime:
    external: true
    name: ai-runtime
