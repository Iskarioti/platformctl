version: "3"

tasks:
  bootstrap:
    cmds:
      - uv sync --all-groups

  dev:
    cmds:
      - uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  lint:
    cmds:
      - uv run ruff check .

  format:
    cmds:
      - uv run ruff format .

  type:
    cmds:
      - uv run mypy app

  test:
    cmds:
      - uv run pytest

  security:
    cmds:
      - trivy fs --scanners vuln,secret,misconfig --exit-code 1 --severity HIGH,CRITICAL .

  sbom:
    cmds:
      - trivy fs --format cyclonedx --output sbom.cdx.json .

  verify:
    deps: [lint, type, test, security]

  eventing:up:
    cmds:
      - docker compose --profile eventing up -d kafka

  eventing:down:
    cmds:
      - docker compose --profile eventing stop kafka

  stop:
    cmds:
      - docker compose down

  reset:
    cmds:
      - docker compose down -v --remove-orphans


  ai:status:
    cmds:
      - curl -fsS "${OLLAMA_BASE_URL:-http://ollama:11434}/api/tags" | jq .

  ai:test:
    cmds:
      - |
        curl -fsS "${OLLAMA_BASE_URL:-http://ollama:11434}/api/generate" \
          -H 'Content-Type: application/json' \
          -d '{"model":"gemma3:4b","prompt":"Return only READY","stream":false}' | jq .

  agent:versions:
    cmds:
      - codex --version
      - claude --version
