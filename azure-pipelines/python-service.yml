trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 0

  - script: |
      curl -LsSf https://astral.sh/uv/install.sh | sh
      echo "##vso[task.prependpath]$HOME/.local/bin"
    displayName: Install uv

  - script: uv sync --all-groups
    displayName: Restore dependencies

  - script: uv run ruff check .
    displayName: Lint

  - script: uv run mypy app
    displayName: Type check

  - script: uv run pytest
    displayName: Tests

  - script: |
      docker build -t local/service:$(Build.BuildId) .
    displayName: Build container

  # Trivy (container vuln scan) + Syft (CycloneDX SBOM) - both via their own
  # official install scripts, matching platform/linux/install-security-tools.sh
  # (workstation security). See docs/security-scanning.md.
  - script: |
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$HOME/.local/bin"
      curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b "$HOME/.local/bin"
      echo "##vso[task.prependpath]$HOME/.local/bin"
    displayName: Install Trivy + Syft

  - script: trivy image --exit-code 1 --severity CRITICAL,HIGH local/service:$(Build.BuildId)
    displayName: Trivy container scan

  - script: syft local/service:$(Build.BuildId) -o cyclonedx-json="$(Build.ArtifactStagingDirectory)/sbom.cyclonedx.json"
    displayName: Generate SBOM

  - publish: $(Build.ArtifactStagingDirectory)/sbom.cyclonedx.json
    artifact: sbom
    displayName: Publish SBOM artifact

  # Add registry push only after PR validation and environment authorization.
