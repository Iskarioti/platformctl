[project]
name = "platformctl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.16",
  "rich>=14",
  "psutil>=7",
  "httpx>=0.28",
  "cryptography>=45",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "jinja2>=3.1",
  "python-multipart>=0.0.18",
  "pyotp>=2.9",
  "qrcode[pil]>=8"
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.24"
]

[project.scripts]
platformctl = "platformctl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
