{% extends "base.html" %}
{% block title %}Set up platformctl control plane{% endblock %}
{% block content %}
<div class="panel">
  <h1>First-run setup</h1>
  <p class="muted">Create the single local operator account for this workstation's control plane. This runs once.</p>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="post" action="/setup">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" required>

    <label for="password">Password (min. 12 characters)</label>
    <input type="password" id="password" name="password" autocomplete="new-password" minlength="12" required>

    <label for="confirm_password">Confirm password</label>
    <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="12" required>

    <button type="submit">Create account</button>
  </form>
</div>
{% endblock %}
