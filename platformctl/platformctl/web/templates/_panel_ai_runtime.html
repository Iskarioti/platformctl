<table>
  <thead><tr><th>Container</th><th>Image</th><th>Status</th></tr></thead>
  <tbody>
  {% for c in items %}
    <tr><td>{{ c.name }}</td><td>{{ c.image }}</td><td>{{ c.status }}</td></tr>
  {% else %}
    <tr><td colspan="3" class="muted">ai-runtime is not running.</td></tr>
  {% endfor %}
  </tbody>
</table>
