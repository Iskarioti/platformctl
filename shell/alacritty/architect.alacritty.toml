# Systems & Platform Architect - managed Alacritty configuration.
# Deployed to ~/.config/alacritty/alacritty.toml by scripts/posix/apply.sh.
# Ported from Iskarioti/.dotfiles's .config/alacritty/alacritty.toml - two
# deliberate changes from the source:
#   - dropped `import = [".../themes/tokyo-night.toml"]`: the source repo's
#     own .gitignore excludes that themes/ directory (expects a separate
#     `git clone alacritty/alacritty-theme` step), and the [colors] block
#     below is already fully self-contained, so the import was redundant
#     (Alacritty's own file takes precedence over an import anyway).
#   - dropped `[terminal.shell] program = "/bin/zsh"`: this repo's default
#     shell differs per OS (bash on Linux, zsh on macOS - workstation.json
#     features.*.shell) - let Alacritty use the user's normal login shell
#     instead of hardcoding one that may not even be installed.

[bell]
animation = "EaseOutExpo"
duration = 0

[colors]
draw_bold_text_with_bright_colors = true

[[colors.indexed_colors]]
color = "0xF8BD96"
index = 16

[[colors.indexed_colors]]
color = "0xF5E0DC"
index = 17

[colors.bright]
black = "0x988BA2"
blue = "0x96CDFB"
cyan = "0x89DCEB"
green = "0xABE9B3"
magenta = "0xF5C2E7"
red = "0xF28FAD"
white = "0xD9E0EE"
yellow = "0xFAE3B0"

[colors.cursor]
cursor = "0xF5E0DC"
text = "0x1E1D2F"

[colors.normal]
black = "0x6E6C7E"
blue = "0x96CDFB"
cyan = "0x89DCEB"
green = "0xABE9B3"
magenta = "0xF5C2E7"
red = "0xF28FAD"
white = "0xD9E0EE"
yellow = "0xFAE3B0"

[colors.primary]
background = "0x1E1D2F"
foreground = "0xD9E0EE"

[cursor]
blink_interval = 500
blink_timeout = 5
unfocused_hollow = false

[cursor.style]
blinking = "Off"
shape = "Block"

[env]
TERM = "xterm-256color"

[font]
size = 14

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[mouse]
hide_when_typing = true

[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>"

[window]
decorations = "full"
dynamic_title = true
option_as_alt = "Both"

[window.dimensions]
columns = 144
lines = 48

[window.padding]
x = 4
y = 4

[general]
live_config_reload = true
