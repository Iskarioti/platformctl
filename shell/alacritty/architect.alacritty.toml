# Systems & Platform Architect - managed Alacritty configuration.
# Deployed to ~/.config/alacritty/alacritty.toml by scripts/posix/apply.sh.
# Ported from Iskarioti/.dotfiles's .config/alacritty/alacritty.toml - two
# deliberate changes from the source:
#   - dropped `import = [".../themes/tokyo-night.toml"]`: the source repo's
#     own .gitignore excludes that themes/ directory (expects a separate
#     `git clone alacritty/alacritty-theme` step), and the [colors] block
#     below is already fully self-contained, so the import was redundant
#     (Alacritty's own file takes precedence over an import anyway).
#   - dropped `[terminal.shell] program = "/bin/zsh"`: this repo's default
#     shell differs per OS (bash on Linux, zsh on macOS - workstation.json
#     features.*.shell) - let Alacritty use the user's normal login shell
#     instead of hardcoding one that may not even be installed.
#
# [font]/[window.dimensions]/[window.padding] are deliberately matched to this
# repo's Windows Terminal profile (windows-terminal/settings.json's
# profiles.defaults + root-level initialCols/initialRows) so both terminals
# feel identical: 144x46 cells, "JetBrainsMono Nerd Font Mono" @ 11pt, 12/8
# padding. This file is shared across Windows/macOS/Linux (no per-OS override
# mechanism today), so the match applies everywhere, not just Windows.
#
# Window *position* (matching Windows Terminal's centerOnLaunch) has no
# equivalent config key here - Alacritty's [window.position] only sets fixed
# absolute pixel coordinates, wrong on any other monitor/resolution. On
# Windows this is instead handled by scripts/windows/launch-alacritty-
# centered.ps1, a launcher that starts Alacritty and repositions its real
# window (found by size, not the unreliable Process.MainWindowHandle) to the
# center of whichever monitor it opened on - wired in via the Start Menu
# shortcut scripts/windows/43-configure-taskbar-appearance.ps1 manages.
# macOS/Linux have no equivalent launcher yet (X11's `wmctrl` could do the
# same trick, Wayland/WSLg cannot) - out of scope until asked for.

[bell]
animation = "EaseOutExpo"
duration = 0

[colors]
draw_bold_text_with_bright_colors = true

[[colors.indexed_colors]]
color = "0xF8BD96"
index = 16

[[colors.indexed_colors]]
color = "0xF5E0DC"
index = 17

[colors.bright]
black = "0x988BA2"
blue = "0x96CDFB"
cyan = "0x89DCEB"
green = "0xABE9B3"
magenta = "0xF5C2E7"
red = "0xF28FAD"
white = "0xD9E0EE"
yellow = "0xFAE3B0"

[colors.cursor]
cursor = "0xF5E0DC"
text = "0x1E1D2F"

[colors.normal]
black = "0x6E6C7E"
blue = "0x96CDFB"
cyan = "0x89DCEB"
green = "0xABE9B3"
magenta = "0xF5C2E7"
red = "0xF28FAD"
white = "0xD9E0EE"
yellow = "0xFAE3B0"

[colors.primary]
background = "0x1E1D2F"
foreground = "0xD9E0EE"

[cursor]
blink_interval = 500
blink_timeout = 5
unfocused_hollow = false

[cursor.style]
blinking = "Off"
shape = "Block"

[env]
TERM = "xterm-256color"

[font]
size = 11

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[mouse]
hide_when_typing = true

[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>"

[window]
decorations = "full"
dynamic_title = true
option_as_alt = "Both"
# Windows Terminal's "centerOnLaunch" has no Alacritty config equivalent
# (Alacritty's [window.position] sets fixed absolute pixel coordinates, not
# "center on this monitor" - there's no boolean for that in its TOML schema).
# Left unset so Alacritty falls back to normal OS/WM window placement.

[window.dimensions]
columns = 144
lines = 46

[window.padding]
x = 12
y = 8

[general]
live_config_reload = true
