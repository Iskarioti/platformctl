x-redis-common: &redis-common
  image: redis:7.4.11-bookworm
  command:
    - redis-server
    - --port
    - "6379"
    - --cluster-enabled
    - "yes"
    - --cluster-config-file
    - nodes.conf
    - --cluster-node-timeout
    - "5000"
    - --appendonly
    - "yes"
    - --protected-mode
    - "no"
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 20
  networks: [lab]

services:
  redis-1:
    <<: *redis-common
    container_name: lab-redis-1
    hostname: redis-1
    volumes: [redis-1-data:/data]
  redis-2:
    <<: *redis-common
    container_name: lab-redis-2
    hostname: redis-2
    volumes: [redis-2-data:/data]
  redis-3:
    <<: *redis-common
    container_name: lab-redis-3
    hostname: redis-3
    volumes: [redis-3-data:/data]
  redis-4:
    <<: *redis-common
    container_name: lab-redis-4
    hostname: redis-4
    volumes: [redis-4-data:/data]
  redis-5:
    <<: *redis-common
    container_name: lab-redis-5
    hostname: redis-5
    volumes: [redis-5-data:/data]
  redis-6:
    <<: *redis-common
    container_name: lab-redis-6
    hostname: redis-6
    volumes: [redis-6-data:/data]

  cluster-init:
    image: redis:7.4.11-bookworm
    container_name: lab-redis-cluster-init
    depends_on:
      redis-1: {condition: service_healthy}
      redis-2: {condition: service_healthy}
      redis-3: {condition: service_healthy}
      redis-4: {condition: service_healthy}
      redis-5: {condition: service_healthy}
      redis-6: {condition: service_healthy}
    entrypoint:
      - sh
      - -ec
      - |
        if redis-cli -h redis-1 cluster info 2>/dev/null | grep -q 'cluster_state:ok'; then
          exit 0
        fi
        redis-cli --cluster create \
          redis-1:6379 redis-2:6379 redis-3:6379 \
          redis-4:6379 redis-5:6379 redis-6:6379 \
          --cluster-replicas 1 --cluster-yes
    networks: [lab]

networks:
  lab:
    name: platform-lab-redis-cluster

volumes:
  redis-1-data:
  redis-2-data:
  redis-3-data:
  redis-4-data:
  redis-5-data:
  redis-6-data:
