apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
spec:
  replicas: 3
  selector:
    matchLabels:
      platformctl.lab: agent-mesh
      app: agent
  template:
    metadata:
      labels:
        platformctl.lab: agent-mesh
        app: agent
    spec:
      containers:
        - name: agent
          image: platformctl-lab-agent-mesh:dev
          imagePullPolicy: Never
          env:
            - name: OLLAMA_BASE_URL
              value: http://ollama:11434
            - name: CHAT_MODEL
              value: gemma3:1b
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agent
spec:
  selector:
    platformctl.lab: agent-mesh
    app: agent
  ports:
    - name: http
      port: 8000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      platformctl.lab: agent-mesh
      app: agent
