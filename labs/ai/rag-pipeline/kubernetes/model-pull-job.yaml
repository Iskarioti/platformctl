apiVersion: batch/v1
kind: Job
metadata:
  name: model-pull
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        platformctl.lab: rag-pipeline
        app: model-pull
    spec:
      restartPolicy: Never
      containers:
        - name: model-pull
          image: ollama/ollama:0.33.2
          env:
            - name: OLLAMA_HOST
              value: ollama:11434
          # gemma3:4b is for the "quality" test's LLM-judge step only -
          # gemma3:1b was confirmed live to be too weak a judge (scored an
          # obviously-correct paraphrase 0.1); it still generates answers
          # fine, so it stays for that.
          command: ["sh", "-ec", "ollama pull nomic-embed-text && ollama pull gemma3:1b && ollama pull gemma3:4b"]
